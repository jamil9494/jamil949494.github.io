    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;

        body {
            background: linear-gradient(180deg, #FF8800 0%, #FF6A00 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, #FF9500 0%, #FF7A00 100%);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .shopee-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

        .shopee-logo span {
            font-size: 28px;
            color: white;

        }

        .number-99 {

            font-weight: bold;

            line-height: 1;
        }

            font-size: 60px;
            color: #FFD100;
        }

        .title h2 {
            font-size: 55px;
            color: #FFD100;

            line-height: 1;
        }

        .date-banner {
            background: #FFD633;
            border-radius: 50px;
            padding: 8px 20px;
            margin: 25px 0;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
        }

        .date-box {
            background: #FF5500;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .period {
            color: white;
            font-size: 16px;

        }

        .btn-section {
            margin: 12px 0;
        }

            color: white;
            border-radius: 12px;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: bold;
            clip-path: polygon(0% 0%, 100% 0%, 95% 50%, 100% 100%, 0% 100%, 5% 50%);
        }

        .btn-green {
            background: linear-gradient(180deg, #00AA55 0%, #008844 100%);

            border-radius: 12px;
            padding: 15px 10px;
            font-size: 20px;
            font-weight: bold;
            clip-path: polygon(0% 0%, 100% 0%, 95% 50%, 100% 100%, 0% 100%, 5% 50%);
        }

        .vip-box {
            background: #FFE899;
            color: #884400;
            font-size: 16px;
            font-weight: bold;
            padding: 5px;
            border-radius: 8px 8px 0 0;
            display: inline-block;
        }

        .vip-badge {
            background: #FF4400;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }

        .small-text {
            margin-top: 30px;
            font-size: 10px;
            color: rgba(255,255,255,0.6);
        }
    </style>
